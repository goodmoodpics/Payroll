[project]
name = "nypayroll"
version = "0.1.0"
description = "NY-state payroll calculator and filing-prep tool (internal use)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nypayroll = "nypayroll.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
nypayroll = ["data/*/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
